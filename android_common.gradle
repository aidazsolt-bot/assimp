println "Root project:	${project.rootProject}";
println "     rootDir:	${project.rootDir}"
println "  projectDir:	${project.projectDir}";
println "    user.dir:	${System.getProperty("user.dir")}";

dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar'])
}

android {
	compileSdk 35
	// Match Filament android/build.gradle versions.ndk
	ndkVersion "29.0.13846066"

	defaultConfig {
        minSdk 21
		targetSdk 34
        externalNativeBuild {
          if (!project.hasProperty(project.name + "ndkBuild") && !project.hasProperty("ndkBuild")) {
            cmake {
                println "CMAKE Global Build CONFIG!!!!"
                // aktuelle NDK-ABI-Doku; armeabi/mips = seit r17 tot, Gradle baut standardmäßig alle non-deprecated ABIs 
                //abiFilters "arm64-v8a"
                //abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                arguments "-DANDROID_STL=c++_static", "-DASSIMP_ANDROID_JNIIOSYSTEM=OFF", "-DASSIMP_BUILD_ZLIB=OFF", "-DASSIMP_NO_EXPORT=ON", "-DASSIMP_BUILD_ALL_IMPORTERS_BY_DEFAULT=OFF", "-DASSIMP_BUILD_OBJ_IMPORTER=ON", "-DASSIMP_BUILD_GEO_IMPORTER=ON" , "-DASSIMP_BUILD_3DS_IMPORTER=ON", "-DASSIMP_BUILD_OFF_IMPORTER=ON", "-DASSIMP_BUILD_GLTF_IMPORTER=ON", "-DASSIMP_BUILD_MD5_IMPORTER=ON", "-DASSIMP_BUILD_MD2_IMPORTER=ON", "-DASSIMP_BUILD_DRACO_STATIC=ON", "-DASSIMP_BUILD_PLY_IMPORTER=ON", "-DASSIMP_BUILD_BLEND_IMPORTER=ON", "-DASSIMP_BUILD_SPZ_IMPORTER=ON", "-DASSIMP_BUILD_SPLAT_IMPORTER=ON", "-DASSIMP_BUILD_SOG_IMPORTER=ON"
                // arguments "-DASSIMP_ANDROID_JNIIOSYSTEM=ON", "-DASSIMP_BUILD_TESTS=OFF", "-DASSIMP_NO_EXPORT=TRUE", "-DASSIMP_BUILD_ZLIB=OFF", "-DASSIMP_BUILD_ALL_IMPORTERS_BY_DEFAULT=FALSE", "-DASSIMP_BUILD_OBJ_IMPORTER=TRUE"
                // ioapi.c / minizip: 64-bit fopen-Wrappers auf Android umgehen
                // Alternativ als CMake-Flag:
		        // arguments "-DANDROID_STL=c++_static",
            	// "-DCMAKE_C_FLAGS=-DUSE_FILE32API"
              	cFlags "-DUSE_FILE32API"
              	// USE_FILE32API + Draco headers pulled into assimp TUs (not only draco
              	// itself). NDK clang -Werror trips on uint→float max() in geometry_attribute.h.
              	cppFlags "-DUSE_FILE32API", "-Wno-implicit-const-int-float-conversion"
            }
          } else {
                //abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64" 
                println "NDK Build CONFIG!!!!"
          }
        }
	}   

	externalNativeBuild {
		if (!project.hasProperty(project.name + "ndkBuild") && !project.hasProperty("ndkBuild")) {
			cmake {
				path "CMakeLists.txt"
			}
		} else {
			ndkBuild {
				path "Android.mk"
			}
		}
	}

	packaging {
		jniLibs {
			excludes += ["/lib/x86/*so", "/lib/armeabi-v7a/*.so"]
			keepDebugSymbols += ['*/mips/*.so', '*/mips64/*.so']
		}
	}

	lint {
		abortOnError false
		disable 'ExpiredTargetSdkVersion'
	}

	buildTypes {
		debug {
		}
		release {
			minifyEnabled false
			shrinkResources false
		}
	}
}
