# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "(buildtoolsupdate)-linux-android-2026" ]
  pull_request:
    branches: [ "(buildtoolsupdate)-linux-android-2026" ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Explicit include-only matrix (no cartesian product):
      # 1. Windows MSVC
      # 2. Linux GCC
      # 3. Linux Clang
      # 4. Linux MinGW-w64 cross (cmake-modules/MinGW_x86_64.cmake)
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl
            toolchain: ""
            cmake_extra: ""
            parallel: ""
            run_tests: true

          - name: ubuntu-gcc
            os: ubuntu-latest
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
            toolchain: ""
            cmake_extra: ""
            parallel: ""
            run_tests: true

          - name: ubuntu-clang
            os: ubuntu-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
            toolchain: ""
            cmake_extra: ""
            parallel: ""
            run_tests: true

          - name: ubuntu-mingw-w64-cross
            os: ubuntu-latest
            build_type: Release
            # Compilers come from the toolchain file; placeholders for matrix display.
            c_compiler: x86_64-w64-mingw32-gcc
            cpp_compiler: x86_64-w64-mingw32-g++
            toolchain: cmake-modules/MinGW_x86_64.cmake
            # PE unit tests cannot run on the Linux runner.
            cmake_extra: >-
              -DASSIMP_BUILD_ZLIB=ON
              -DASSIMP_BUILD_TESTS=OFF
              -DASSIMP_BUILD_ASSIMP_TOOLS=OFF
              -DASSIMP_WARNINGS_AS_ERRORS=OFF
            # Cap jobs: unbounded --parallel OOMs MinGW cc1plus on ubuntu-latest (~7GB).
            parallel: "2"
            run_tests: false

    steps:
    - uses: actions/checkout@v7

    - name: Install MinGW-w64 toolchain
      if: matrix.toolchain != ''
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake (native)
      if: matrix.toolchain == ''
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (MinGW cross)
      if: matrix.toolchain != ''
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/${{ matrix.toolchain }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        ${{ matrix.cmake_extra }}
        -S ${{ github.workspace }}

    - name: Build
      if: matrix.parallel == ''
      # --config is needed for multi-config generators (Visual Studio on Windows).
      run: >
        cmake --build ${{ steps.strings.outputs.build-output-dir }}
        --config ${{ matrix.build_type }}

    - name: Build (limited parallelism)
      if: matrix.parallel != ''
      run: >
        cmake --build ${{ steps.strings.outputs.build-output-dir }}
        --config ${{ matrix.build_type }}
        --parallel ${{ matrix.parallel }}

    - name: Test
      if: matrix.run_tests
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}
