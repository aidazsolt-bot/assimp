name: Android CI

on:
  push:
    branches: [ "(buildtoolsupdate)-linux-android-2026" ]
  pull_request:
    branches: [ "(buildtoolsupdate)-linux-android-2026" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'redhat'
        cache: gradle
    - name: Check java version and PATH setting
      run: java --version

    - name: Feth Android SDK
      uses: schmiddim/action-wget-unzip@v2
      with:
        url: 'https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip'
        destination: SDK

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build
