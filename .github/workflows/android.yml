name: Android CI

on:
  push:
    branches: [ "(buildtoolsupdate)-linux-android-2026" ]
  pull_request:
    branches: [ "(buildtoolsupdate)-linux-android-2026" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'redhat'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build
